<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0b0b14"/>
  <!-- MTG card outline -->
  <rect x="14" y="8" width="36" height="48" rx="4" fill="none" stroke="#7c5cff" stroke-width="2.5"/>
  <!-- Inner card border -->
  <rect x="18" y="12" width="28" height="40" rx="2" fill="none" stroke="#7c5cff" stroke-width="1" opacity="0.5"/>
  <!-- Question mark -->
  <text x="32" y="42" font-family="Georgia, serif" font-size="28" font-weight="bold"
        text-anchor="middle" fill="#7c5cff">?</text>
  <!-- Card art placeholder dots -->
  <circle cx="24" cy="22" r="2" fill="#7c5cff" opacity="0.4"/>
  <circle cx="32" cy="22" r="2" fill="#7c5cff" opacity="0.4"/>
  <circle cx="40" cy="22" r="2" fill="#7c5cff" opacity="0.4"/>
</svg>
